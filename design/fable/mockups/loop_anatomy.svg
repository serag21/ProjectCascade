<text x="28" y="518" font-size="10.5" fill="#1b2440">Your ribbon is always on: 4.2 s / 100 studs.</text>
<text x="28" y="532" font-size="10.5" fill="#1b2440">Sparks shy away from you and bunch up.</text>
