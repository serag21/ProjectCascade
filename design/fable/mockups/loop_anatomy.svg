<text x="318" y="500" font-size="15" font-weight="bold" fill="#1b2440">2. CLOSE (or SNAP)</text>
<text x="318" y="518" font-size="10.5" fill="#1b2440">Cross your own ribbon, or get within 4.5 studs</text>
<text x="318" y="532" font-size="10.5" fill="#1b2440">and it snaps shut. Dash to close = SNAP bonus.</text>
